name: Coletar partidas

on:
  schedule:
    # A cada 3 horas (horário UTC)
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  # Roda também quando a lista de jogadores ou o coletor mudam
  push:
    branches: [main]
    paths:
      - players.json
      - scripts/**
      - .github/workflows/collect.yml

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados no Leetify
        env:
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
        run: node scripts/collect.mjs

      - name: Salvar dados novos
        run: |
          git config user.name "cs-hub-bot"
          git config user.email "cs-hub-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Dados atualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X theirs origin main || true
            git push
          fi
